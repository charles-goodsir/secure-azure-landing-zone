trigger:
- main

pool:
  vmImage: 'ubuntu-latest'

stages:
- stage: Validate
  displayName: 'Validate Terraform'
  jobs:
  - job: TerraformValidate
    displayName: 'terraform fmt & validate'
    steps:
    - script: |
        mkdir -p tf-install && cd tf-install
        rm -f terraform terraform.zip
        TF_VERSION=1.9.8
        curl -o terraform.zip https://releases.hashicorp.com/terraform/${TF_VERSION}/terraform_${TF_VERSION}_linux_amd64.zip
        unzip -o terraform.zip
        sudo mv terraform /usr/local/bin/
        cd ..
        terraform -version
      displayName: 'Install Terraform'
    - script: terraform fmt -check -diff
      displayName: 'Terraform Format Check'
      workingDirectory: terraform
    - script: terraform init -backend=false
      displayName: 'Terraform Init'
      workingDirectory: terraform
    - script: terraform validate
      displayName: 'Terraform Validate'
      workingDirectory: terraform
- stage: SecurityScan
  displayName: 'Security Scan'
  dependsOn: Validate
  jobs:
  - job: TfsecScan
    displayName: 'Security Scan'
    steps:
    - script: |
        # ponytail: curl|bash with no version pin or checksum, trusts the install
        # script's content at run time. Fine for a personal project; pin an exact
        # tfsec release + verify a checksum before using this in production.
        curl -s https://raw.githubusercontent.com/aquasecurity/tfsec/master/scripts/install_linux.sh | bash
        tfsec terraform/
      displayName: 'Run tfsec'
- stage: Plan
  displayName: 'Terraform Plan'
  dependsOn: 'SecurityScan'
  jobs:
  - job: TerraformPlan
    displayName: 'terraform plan'
    steps:
    - task: AzureCLI@2
      displayName: 'Terraform Init & Plan'
      inputs:
        azureSubscription: 'azure-landing-zone-connection'
        scriptType: bash
        scriptLocation: inlineScript
        addSpnToEnvironment: true
        inlineScript: |
          mkdir -p tf-install && cd tf-install
          curl -o terraform.zip https://releases.hashicorp.com/terraform/1.9.8/terraform_1.9.8_linux_amd64.zip
          unzip -o terraform.zip
          sudo mv terraform /usr/local/bin/
          cd ../terraform

          export ARM_CLIENT_ID=$servicePrincipalId
          export ARM_TENANT_ID=$tenantId
          export ARM_SUBSCRIPTION_ID=$(az account show --query id -o tsv)
          export ARM_USE_OIDC=true
          export ARM_OIDC_TOKEN=$idToken

          terraform init \
            -backend-config="resource_group_name=rg-tfstate" \
            -backend-config="storage_account_name=tfstatecg21836" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=landingzone.tfstate" \
            -backend-config="use_azuread_auth=true"
          terraform plan -out=tfplan
    - publish: terraform/tfplan
      artifact: tfplan

