trigger:
  branches:
    include:
      - main
  paths:
    exclude:
      - docs
pr:
  branches:
    include:
      - main

pool:
  vmImage: "ubuntu-latest"

stages:
  - stage: Validate
    displayName: "Validate Terraform"
    jobs:
      - job: TerraformValidate
        displayName: "terraform fmt & validate"
        steps:
          - template: templates/install-terraform.yml
          - script: terraform fmt -check -diff
            displayName: "Terraform Format Check"
            workingDirectory: terraform
          - script: terraform init -backend=false -lockfile=readonly
            displayName: "Terraform Init"
            workingDirectory: terraform
          - script: terraform validate
            displayName: "Terraform Validate"
            workingDirectory: terraform
  - stage: SecurityScan
    displayName: "Security Scan"
    dependsOn: Validate
    jobs:
      - job: TrivyScan
        displayName: "Trivy scan"
        steps:
          - script: |
              set -euo pipefail
              mkdir -p trivy-install && cd trivy-install
              TRIVY_VERSION=0.74.0
              BASE_URL=https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}
              curl -sLO ${BASE_URL}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz
              curl -sLO ${BASE_URL}/trivy_${TRIVY_VERSION}_checksums.txt
              grep "Linux-64bit.tar.gz$" trivy_${TRIVY_VERSION}_checksums.txt | sha256sum -c -
              tar -xzf trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz trivy
              sudo mv trivy /usr/local/bin/
              cd ..
              trivy config --exit-code 1 terraform/
            displayName: "Run Trivy"
  - stage: Plan
    displayName: "Terraform Plan"
    dependsOn: "SecurityScan"
    jobs:
      - job: TerraformPlan
        displayName: "terraform plan"
        steps:
          - template: templates/install-terraform.yml
          - template: templates/terraform-azure.yml
            parameters:
              displayName: "Terraform Init & Plan"
              command: terraform plan -out=tfplan
          - publish: terraform/tfplan
            artifact: tfplan
  - stage: Apply
    displayName: "Terraform Apply"
    dependsOn: Plan
    condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
    jobs:
      - deployment: TerraformApply
        displayName: "terraform apply"
        environment: "production"
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                - template: templates/install-terraform.yml
                - template: templates/terraform-azure.yml
                  parameters:
                    displayName: "Terraform Apply"
                    command: terraform apply -auto-approve $(Pipeline.Workspace)/tfplan/tfplan
