trigger: none
pr: none

schedules:
  - cron: "0 17 * * 0"
    displayName: "Weekly drift check (Mon 3am AEST)"
    branches:
      include:
        - main
    always: true
pool:
  vmImage: "ubuntu-latest"
steps:
  - template: templates/install-terraform.yml
  - task: AzureCLI@2
    displayName: "Terraform Plan (drift check)"
    inputs:
      azureSubscription: "azure-landing-zone-connection"
      scriptType: bash
      scriptLocation: inlineScript
      addSpnToEnvironment: true
      inlineScript: |
        cd terraform

        export ARM_CLIENT_ID=$servicePrincipalId
        export ARM_TENANT_ID=$tenantId
        export ARM_SUBSCRIPTION_ID=$(az account show --query id -o tsv)
        export ARM_USE_OIDC=true
        export ARM_OIDC_TOKEN=$idToken

        terraform init \
          -backend-config="resource_group_name=rg-tfstate" \
          -backend-config="storage_account_name=tfstatecg21836" \
          -backend-config="container_name=tfstate" \
          -backend-config="key=landingzone.tfstate" \
          -backend-config="use_azuread_auth=true" \
          -lockfile=readonly

        rc=0
        terraform plan -detailed-exitcode -lock=false -input=false || rc=$?
        if [ "$rc" -eq 2 ]; then
          echo "##vso[task.logissue type=error]Drift detected: Azure no longer matches the Terraform code."
        fi
        exit $rc
