trigger: none
pr: none

schedules:
  - cron: "0 17 * * 0"
    displayName: "Weekly drift check (Mon 3am AEST)"
    branches:
      include:
        - main
    always: true
pool:
  vmImage: "ubuntu-latest"
steps:
  - template: templates/install-terraform.yml
  - template: templates/terraform-azure.yml
    parameters:
      displayName: "Terraform Plan (drift check)"
      command: |
        rc=0
        terraform plan -detailed-exitcode -lock=false -input=false || rc=$?
        if [ "$rc" -eq 2 ]; then
          echo "##vso[task.logissue type=error]Drift detected: Azure no longer matches the Terraform code."
        fi
        exit $rc
